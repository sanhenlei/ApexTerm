name: CI

on:
  push:
    branches: [ master, main, feature/library-workbench ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build artifact cleanup safety
        run: python3 -m unittest discover -s scripts/tests

      - name: Swift Build (Debug)
        run: swift build -v

      - name: Run Tests
        # Performance baselines (font enumeration <150ms, VTParser >50k spans/s) are
        # calibrated on real Apple Silicon hardware and fail unreliably on shared CI
        # runner VMs — upstream master's GitHub CI fails on the same two tests. All
        # functional tests still run; hardware benches stay gated by Tart VM acceptance.
        run: swift test --skip testTerminalFontManagerFastEnumerationUnder150ms --skip testBenchmark2_VTParserColorParsingThroughput -v

      - name: Swift Build (Release)
        run: swift build -c release -v

      - name: Compile window UI acceptance suite
        run: xcodebuild build-for-testing -project UITests/ApexTermUITests.xcodeproj -scheme ApexTermUITests -destination 'platform=macOS' -derivedDataPath outputs/ui-acceptance/DerivedData -jobs 2
